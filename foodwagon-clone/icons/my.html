<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Foodwagon-clone</title>
    </head>
    <body>
        <!--navbar-->
        <header>
            <nav>
                <div class="logo">
                    <img src="icons/logo.png" alt="Foodwagon Logo">
                    <div class>
                        <p><strong>deliver to:</strong> <img
                                src="icons/location.png" alt=>
                            Current location <strong>Mohammadpur Bus Stand,
                                Dhaka</strong></p>
                    </div>
                    <p><img src="icons/magnifying-glass.png"
                            alt="search icon">search</p>
                    <button><img src="icons/person.png" alt> login</button>
                </div>
            </nav>
        </header>
        <!--hero section-->
        <section class="hero-section">
            <div class="hero-content">
                <h1>ARE YOU STARVING?</h1>
                <p>Within a few clicks, find meals that are accessible to
                    you</p>
                <div class>
                    <form action>
                        <span><img src="icons/delivery.png" alt>Deliver</span>
                        <span><img src="icons/bag.png" alt>Pickup</span><hr>
                        <input type="text" placeholder="Enter your address">
                        <button type="submit">find food</button>
                    </form>
                </div>
            </div>
        </section>
        <!--deals section-->
        <section>
            <div>
                <div class="deals-card">
                    <img src="images/frame 19.png" alt>
                    <strong>Graye Vege</strong>
                    <div class="day-count">6 days remaining</div>
                </div>
                <div class="deals-card">
                    <img src="images/frame 7.png" alt>
                    <strong>Graye Vege</strong>
                    <div class="day count">6 days remaining</div>
                </div>
                <div class="deals-card">
                    <img src="images/frame 4.png" alt>
                    <strong>Graye Vege</strong>
                    <div class="day-count>6 days remaining</div>
                </div>
                <div class="deals-card">
                        <img src="images/frame 5.png" alt>
                        <strong>Graye Vege</strong>
                        <div class="day-count">6 days remaining</div>
                    </div>

                </div>
            </section>
            <!--how does it work section-->
            <section>

            </section>
        </body>
    </html>
